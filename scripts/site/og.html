<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bdhtml2pdf social card</title>
<!-- The 1200×630 Open Graph image of the website, rendered by bdhtml2pdf.
     scripts/site.sh copies this file next to showcase.png and runs:
     bdhtml2pdf --width 1200 --height 630 og.html og.png -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: "Noto Sans", sans-serif; color: white;
    background: linear-gradient(125deg, #3f4fd8 0%, #5a3fc4 55%, #7b3fb0 100%);
  }
  .text { position: absolute; left: 72px; top: 76px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .brand svg { width: 56px; height: 56px; }
  h1 { margin: 56px 0 0; font-size: 58px; line-height: 1.08; letter-spacing: -.025em; font-weight: 800; }
  p { margin: 26px 0 0; font-size: 25px; line-height: 1.4; opacity: .9; }
  .chips { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 12px; }
  .chips span { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.16); font-size: 19px; font-weight: 600; }
  .shot { position: absolute; left: 690px; top: 70px; width: 600px; border-radius: 14px; box-shadow: 0 30px 60px rgba(20,10,60,.45); transform: rotate(-3deg); background: white; padding: 10px; }
  .shot img { display: block; width: 100%; border-radius: 6px; }
</style>
</head>
<body>
<div class="text">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#ffffff"/><path d="M20 11h17l11 11v30a2 2 0 0 1-2 2H20a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2z" fill="#4f5fe6"/><path d="M37 11v9a2 2 0 0 0 2 2h9z" fill="#a9b2f7"/><path d="M27 32l-5.5 5.5L27 43M37 32l5.5 5.5L37 43" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    bdhtml2pdf
  </div>
  <h1>HTML + JavaScript → vector PDF</h1>
  <p>A modern successor to wkhtmltopdf. One small process, no browser.</p>
</div>
<div class="chips"><span>Firefox's CSS engine</span><span>React · Vue · Preact</span><span>Rust</span></div>
<div class="shot"><img src="showcase.png" alt=""></div>
</body>
</html>
