# Pushing a tag vX.Y.Z builds the release binaries and opens a *draft*
# GitHub release with them. Review the notes and publish it by hand; see
# docs/benchmarks/README.md#release-procedure.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: bdhtml2pdf

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in Debian 12; the binaries need glibc 2.35 (the
          # newest symbol version they use), so Ubuntu 22.04 runs them too.
          # `name` is the platform in the archive name, without the target
          # triple's vendor field (`unknown`, `pc`).
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            os: ubuntu-24.04
            container: rust:1-bookworm
          - target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            os: ubuntu-24.04-arm
            container: rust:1-bookworm
          - target: aarch64-apple-darwin
            name: macos-aarch64
            os: macos-15
          - target: x86_64-pc-windows-msvc
            name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: bdhtml2pdf
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: scripts/upstream.sh fetch
      - if: matrix.container
        run: apt-get update && apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
      - if: ${{ !matrix.container }}
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=bdhtml2pdf-$VERSION-${{ matrix.name }}
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp ../target/release/bdhtml2pdf.exe "$name/"
            7z a -tzip -bso0 "$name.zip" "$name"
            archive=$name.zip
          else
            cp ../target/release/bdhtml2pdf "$name/"
            tar czf "$name.tar.gz" "$name"
            archive=$name.tar.gz
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bdhtml2pdf/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=
          [[ $version == 0.* || $version == *-* ]] && prerelease=--prerelease
          cat > notes.md <<EOF
          Binaries for Linux (x86_64, aarch64; glibc 2.35 or newer and
          fontconfig, \`libfontconfig1\` / \`fontconfig\`), macOS (Apple
          silicon) and Windows (x86_64). Each archive has a \`.sha256\` file.

          Benchmark and security results:
          [docs/benchmarks](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME/docs/benchmarks).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease \
            --title "bdhtml2pdf $version" \
            --notes-file notes.md \
            --generate-notes
