[package]
name = "bdhtml2pdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Lightweight HTML / JavaScript to PDF engine (modern wkhtmltopdf successor)"

[dependencies]
# DOM + Stylo + Taffy + Parley, and the Boa JS bindings (blitz-vibey-script).
# Pinned to a Blitz master rev; vibey-script is not published on crates.io.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015", default-features = false, features = ["svg", "woff", "system-fonts"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015" }
blitz-vibey-script = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015" }

# PDF backend: fulgur, a local branch ported to Blitz master (../fulgur, branch
# blitz-master). One Stylo (0.24): the same engine as the DOM that JS uses.
fulgur = { path = "../fulgur/crates/fulgur" }

# Image output: Blitz's painter, rasterized on the CPU, encoded by `image`.
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015", default-features = false, features = ["svg"] }
anyrender = "0.15"
anyrender_vello_cpu = { version = "0.19", default-features = false }
peniko = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Stylo runtime prefs: Blitz leaves `:has()`, `:nth-child(of S)` and container
# queries switched off; bdhtml2pdf turns them on (see src/prefs.rs).
style_config = { version = "0.24.0", package = "stylo_static_prefs" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
url = "2"
# write(2) and _exit(2) from inside the global allocator (src/limits.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Use the same Blitz copy as fulgur: a local clone (rev b4ad543 plus the patches
# on branch public-layout-pass). They are submitted upstream; see docs/roadmap.md.
[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "../blitz/packages/blitz-dom" }
blitz-html = { path = "../blitz/packages/blitz-html" }
blitz-paint = { path = "../blitz/packages/blitz-paint" }
blitz-traits = { path = "../blitz/packages/blitz-traits" }
blitz-vibey-script = { path = "../blitz/packages/blitz-vibey-script" }
