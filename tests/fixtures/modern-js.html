<!DOCTYPE html>
<html lang="tr">
<head><meta charset="utf-8"><title>Modern JS</title></head>
<body>
<ul id="out"></ul>
<script type="module">
const out = document.getElementById('out');
const ok = (name, pass) => {
  const li = document.createElement('li');
  li.textContent = `${pass ? 'PASS' : 'FAIL'} ${name}`;
  out.append(li);
};
const safe = (name, fn) => { try { ok(name, fn()); } catch (e) { ok(`${name} (${e})`, false); } };

class Base { #x = 1; get x() { return this.#x; } static make() { return new this(); } }
class Child extends Base {}
safe('class + private field + static', () => Child.make().x === 1);
safe('optional chaining / nullish', () => (null?.a ?? 'd') === 'd');
safe('destructuring + spread', () => { const { a, ...r } = { a: 1, b: 2 }; return a === 1 && r.b === 2; });
safe('Map/Set', () => new Map([[1, 2]]).get(1) === 2 && new Set([1, 1]).size === 1);
safe('Array.prototype.at / flatMap', () => [1, 2, 3].at(-1) === 3 && [[1], [2]].flatMap(x => x).length === 2);
safe('Object.groupBy', () => Object.groupBy([1, 2, 3], n => n % 2 ? 'odd' : 'even').odd.length === 2);
safe('structuredClone', () => structuredClone({ a: [1] }).a[0] === 1);
safe('TypedArray', () => new Uint8Array([1, 2]).reduce((a, b) => a + b) === 3);
safe('RegExp named groups', () => /(?<y>\d{4})/.exec('2026').groups.y === '2026');
safe('Intl.NumberFormat tr', () => typeof new Intl.NumberFormat('tr-TR').format(1234.5) === 'string');
safe('JSON', () => JSON.parse(JSON.stringify({ ğ: 'ş' })).ğ === 'ş');
safe('querySelectorAll', () => document.querySelectorAll('li').length > 0);
safe('classList / dataset', () => { out.classList.add('k'); out.dataset.v = '1'; return out.classList.contains('k') && out.getAttribute('data-v') === '1'; });
safe('template + DocumentFragment', () => { const f = document.createDocumentFragment(); f.append(document.createElement('i')); return f.childNodes.length === 1; });

const sleep = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  await sleep(50);
  ok('async/await + setTimeout', true);
  await Promise.resolve();
  ok('microtask', true);
  requestAnimationFrame(() => ok('requestAnimationFrame', true));
  queueMicrotask(() => ok('queueMicrotask', true));
  try {
    const r = await fetch('./data.json');
    const j = await r.json();
    ok('fetch local JSON', j.ad === 'Çağrı');
  } catch (e) { ok(`fetch local JSON (${e})`, false); }
  await sleep(20);
  window.status = 'ready';
})();
</script>
</body>
</html>
