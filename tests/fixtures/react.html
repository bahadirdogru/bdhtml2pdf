<!DOCTYPE html>
<html lang="tr">
<head><meta charset="utf-8"><title>React 18</title></head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script>
const e = React.createElement;
function Invoice({ items }) {
  const [paid, setPaid] = React.useState(false);
  React.useEffect(() => { setTimeout(() => setPaid(true), 100); }, []);
  const total = items.reduce((s, i) => s + i.qty * i.price, 0);
  return e('div', { className: 'invoice' },
    e('h1', null, 'Fatura #2026-001'),
    e('table', null, e('tbody', null,
      items.map(i => e('tr', { key: i.name }, e('td', null, i.name), e('td', null, String(i.qty * i.price))))
    )),
    e('p', { id: 'total' }, `Toplam: ${total}`),
    e('p', { id: 'status' }, paid ? 'Durum: ÖDENDİ' : 'Durum: bekliyor'));
}
const items = Array.from({ length: 50 }, (_, n) => ({ name: `Ürün ${n + 1}`, qty: n % 5 + 1, price: 10 }));
ReactDOM.createRoot(document.getElementById('root')).render(e(Invoice, { items }));
</script>
</body>
</html>
